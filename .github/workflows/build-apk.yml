name: 📱 Build Android APK

on:
  push:
    branches: [main, preprod]
    tags: ['v*']          # ex: v1.0.1 → crée une Release GitHub
  workflow_dispatch:      # Lancement manuel depuis GitHub
    inputs:
      target_env:
        description: 'Environnement cible'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - preprod
          - develop
      custom_api_url:
        description: 'URL API personnalisée (optionnel)'
        required: false
        type: string
        default: ''

jobs:
  build-apk:
    name: 🔨 Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java (requis pour Gradle) ────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ── 3. Flutter (même version que locale : 3.47.2) ───────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      # ── 4. Dépendances ──────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── 5. Définir l'environnement cible ────────────────────────
      - name: Set Environment API URL
        run: |
          TARGET="${{ github.event.inputs.target_env }}"
          if [ -z "$TARGET" ]; then
            if [ "${{ github.ref }}" = "refs/heads/preprod" ]; then
              TARGET="preprod"
            elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
              TARGET="develop"
            else
              TARGET="prod"
            fi
          fi
          
          CUSTOM="${{ github.event.inputs.custom_api_url }}"
          if [ -n "$CUSTOM" ]; then
            API_URL="$CUSTOM"
          elif [ "$TARGET" = "preprod" ]; then
            API_URL="${{ secrets.PREPROD_API_URL || 'https://staging-api.myterrain.sn' }}"
          elif [ "$TARGET" = "develop" ]; then
            API_URL="${{ secrets.DEV_API_URL || 'http://127.0.0.1:8000' }}"
          else
            API_URL="${{ secrets.PROD_API_URL || 'https://api.myterrain.sn' }}"
          fi
          
          echo "ENV_NAME=$TARGET" >> $GITHUB_ENV
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          echo "Building for $TARGET with API: $API_URL"

      # ── 6. Build APK release ────────────────────────────────────
      - name: Build APK
        run: flutter build apk --release --dart-define=API_URL="${{ env.API_URL }}"

      # ── 7. Renommer avec version + date ─────────────────────────
      - name: Rename APK
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')
          DATE=$(date +%Y%m%d)
          cp build/app/outputs/flutter-apk/app-release.apk \
             "myTerrain-${{ env.ENV_NAME }}-v${VERSION}-${DATE}.apk"
          echo "APK_NAME=myTerrain-${{ env.ENV_NAME }}-v${VERSION}-${DATE}.apk" >> $GITHUB_ENV

      # ── 8. Upload artifact (onglet Actions, 30 jours) ───────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      # ── 9. Release GitHub (seulement sur tag v*) ────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
          name: "myTerrain ${{ github.ref_name }}"
          body: |
            ## 📱 myTerrain APK (${{ env.ENV_NAME }})

            ### Installation
            1. Téléchargez l'APK ci-dessous
            2. **Paramètres → Sécurité → Sources inconnues** (activer)
            3. Ouvrez le fichier APK et installez

            ### Backend
            - API : `${{ env.API_URL }}`
